version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistics-compliance-backend
    env_file:
      - .env.example
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logistics-compliance-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
